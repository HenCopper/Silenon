<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Silenon — Simples no silício</title>
    <meta name="description" content="Plataforma offline de fixação acelerada de conteúdo, filtros ultra-rápidos e banco de questões estruturado em JSON." />
    <meta property="og:title" content="Silenon — Simples no silício" />
    <meta property="og:description" content="Plataforma offline de fixação acelerada de conteúdo, filtros ultra-rápidos e banco de questões estruturado em JSON." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#100300" />
    
    <!-- Mobile & PWA optimization (iOS & Android) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Silenon" />
    <link rel="icon" type="image/svg+xml" href="/silenon-logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <script>
      (function() {
        try {
          var p = null;
          try {
            p = localStorage.getItem('memoriz_prefs_v1') || localStorage.getItem('memoriz_prefs') || localStorage.getItem('memoriz_theme');
          } catch (storageErr) {}
          var t = 'night';
          if (p) {
            if (p.charCodeAt(0) === 123) { // starts with '{'
              try {
                var parsed = JSON.parse(p);
                if (parsed && parsed.theme) t = parsed.theme;
              } catch (jsonErr) {}
            } else {
              t = p;
            }
          }
          t = t === 'amber' ? 'night' : (t === 'sepia' ? 'reading' : t);
          var C = {
            light:   { b: '#f1f5f9', t: '#0f172a', a: '#2f7596', ac: '#ffffff' },
            dark:    { b: '#07090e', t: '#f8fafc', a: '#6366f1', ac: '#ffffff' },
            reading: { b: '#fbf5e8', t: '#2b1d0c', a: '#854d0e', ac: '#ffffff' },
            night:   { b: '#100300', t: '#ff7733', a: '#ff2b00', ac: '#100300' }
          };
          var c = C[t] || C.night;
          var s = document.documentElement.style;
          s.setProperty('--theme-bg', c.b);
          s.setProperty('--theme-app-bg', c.b);
          s.setProperty('--theme-text-primary', c.t);
          s.setProperty('--theme-accent', c.a);
          s.setProperty('--theme-accent-contrast', c.ac);
          var overshoot = 100 + Math.floor(Math.random() * 36);
          s.setProperty('--si-peak-y', '-' + overshoot + 'px');
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', c.b);
        } catch (e) {}
      })();

      window.__signalReady = function(onComplete) {
        var preloader = document.getElementById('app-preloader');
        var status = document.getElementById('preloader-status-ready');
        if (!preloader) {
          if (onComplete) onComplete();
          return;
        }

        preloader.style.opacity = '1';
        if (status) {
          status.style.opacity = '1';
          status.style.transform = 'translateY(0)';
        }

        if (onComplete) {
          onComplete();
        }
      };
    </script>
    <style>
      html[data-theme="light"] { --theme-bg: #f1f5f9; --theme-app-bg: #f1f5f9; --theme-text-primary: #0f172a; --theme-accent: #2f7596; --theme-accent-contrast: #ffffff; --silenon-mark-bg: #080b12; --silenon-mark-fg: #ffffff; --silenon-mark-dot: #ff2b00; }
      html[data-theme="dark"] { --theme-bg: #07090e; --theme-app-bg: #07090e; --theme-text-primary: #f8fafc; --theme-accent: #6366f1; --theme-accent-contrast: #ffffff; --silenon-mark-bg: #080b12; --silenon-mark-fg: #ffffff; --silenon-mark-dot: #ff2b00; }
      html[data-theme="reading"], html[data-theme="sepia"] { --theme-bg: #fbf5e8; --theme-app-bg: #fbf5e8; --theme-text-primary: #2b1d0c; --theme-accent: #854d0e; --theme-accent-contrast: #ffffff; --silenon-mark-bg: #080b12; --silenon-mark-fg: #ffffff; --silenon-mark-dot: #ff2b00; }
      html[data-theme="night"], html[data-theme="amber"] { --theme-bg: #100300; --theme-app-bg: #100300; --theme-surface-elevated: #260900; --theme-border-strong: #801c00; --theme-text-primary: #ff7733; --theme-accent: #ff2b00; --theme-accent-contrast: #100300; --silenon-mark-bg: var(--theme-surface-elevated); --silenon-mark-fg: var(--theme-text-primary); --silenon-mark-dot: var(--theme-accent); }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: var(--theme-bg, var(--theme-app-bg, #100300));
        color: var(--theme-text-primary, #ff7733);
        overflow-x: hidden;
      }
      html:has(#app-preloader),
      body:has(#app-preloader) {
        overflow: hidden !important;
        height: 100% !important;
      }
      #app-preloader {
        opacity: 1 !important;
        background-color: var(--theme-bg, var(--theme-app-bg, #100300)) !important;
      }
      #app-preloader,
      #app-preloader * {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        transition: none !important;
      }
      html[data-theme="night"] #app-preloader img,
      html[data-theme="amber"] #app-preloader img,
      html[data-theme="night"] #app-preloader svg.emoji-filter,
      html[data-theme="amber"] #app-preloader svg.emoji-filter {
        filter: url(#circadian-zero-blue) !important;
        -webkit-filter: url(#circadian-zero-blue) !important;
      }

      /* Reforço de luminosidade do halo no modo Noturno (Zero Azul / Brilho Radiante) */
      html[data-theme="night"] .preloader-halo-layer,
      html[data-theme="amber"] .preloader-halo-layer {
        background: #ff2b00 !important;
        opacity: 0.55 !important;
        filter: blur(14px) drop-shadow(0 0 8px rgba(255, 43, 0, 0.6)) !important;
      }

      /* Reforço de contraste do halo no modo Sépia / Leitura (Canela Encorpado) */
      html[data-theme="reading"] .preloader-halo-layer,
      html[data-theme="sepia"] .preloader-halo-layer {
        background: #854d0e !important;
        opacity: 0.50 !important;
        filter: blur(12px) !important;
      }
    </style>
  </head>
  <body class="bg-canvas text-primary antialiased min-h-[100vh] min-h-[100dvh]">
    <!-- Hardware/SVG Circadian Zero-Blue Filter Definition (Monochromatic pure red luminance: R = 0.299R + 0.587G + 0.114B, G = 0, B = 0) -->
    <svg width="0" height="0" class="absolute w-0 h-0 overflow-hidden pointer-events-none" aria-hidden="true">
      <filter id="circadian-zero-blue" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="
          0.299  0.587  0.114  0  0
          0.000  0.000  0.000  0  0
          0.000  0.000  0.000  0  0
          0.000  0.000  0.000  1  0" />
      </filter>
    </svg>

    <div id="root">
      <!-- Lightweight, zero-flash pre-mount loading shell consuming inline theme variables -->
      <div 
        id="app-preloader" 
        style="position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; padding: 24px; box-sizing: border-box; text-align: center; opacity: 1; background-color: var(--theme-bg, var(--theme-app-bg)); color: var(--theme-text-primary); z-index: 99999;"
      >

        <!-- Marca: ícone oficial com halo suave pulsante atrás -->
        <div style="position: relative; width: 48px; height: 48px; margin-bottom: 22px;">
          <div 
            class="preloader-halo-layer"
            style="position: absolute; inset: -10px; border-radius: 20px; background: var(--theme-accent); opacity: 0.35; filter: blur(14px); animation: preloader-halo 2.2s ease-in-out infinite; z-index: 1; transition: none !important;"
          ></div>
          <!-- Ícone oficial Silenon (Si) com corte horizontal de estilete (y <= 376) + leque orgânico saindo acima do topo -->
          <svg 
            viewBox="0 0 512 512" 
            width="48" 
            height="48" 
            style="width: 48px; height: 48px; display: block; position: relative; z-index: 2; border-radius: 14px; overflow: visible; transition: none !important;"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <clipPath id="silenon-slit-cut-preloader">
                <rect x="-250" y="-250" width="1012" height="626" />
              </clipPath>
            </defs>
            <rect class="silenon-mark-rect" width="512" height="512" rx="112" fill="var(--silenon-mark-bg, #080b12)" stroke="var(--theme-border-strong)" />
            <g clip-path="url(#silenon-slit-cut-preloader)">
              <path 
                class="si-slit-piece si-slit-s-bottom"
                d="M 124 292 L 328 244 V 376 H 124 V 328 H 276 V 304 L 124 340 Z" 
                fill="var(--silenon-mark-fg, #ffffff)" 
              />
              <path 
                class="si-slit-piece si-slit-i-stem"
                d="M 368 235 L 420 223 V 376 H 368 Z" 
                fill="var(--silenon-mark-fg, #ffffff)" 
              />
              <path 
                class="si-slit-piece si-slit-s-top"
                d="M 328 136 H 124 V 264 L 328 216 V 168 L 176 204 V 184 H 328 Z" 
                fill="var(--silenon-mark-fg, #ffffff)" 
              />
              <path 
                class="si-slit-piece si-slit-i-dot"
                d="M 382 136 H 434 L 420 195 L 368 207 Z" 
                fill="var(--silenon-mark-dot, #ff2b00)" 
              />
            </g>
          </svg>
        </div>

        <!-- Onda de 3 blocos, ecoando o motivo das 3 lâmpadas da luminária -->
        <div style="display: flex; gap: 7px; margin-bottom: 18px;">
          <span class="preloader-dot" style="animation-delay: 0s;"></span>
          <span class="preloader-dot" style="animation-delay: 0.15s;"></span>
          <span class="preloader-dot" style="animation-delay: 0.3s;"></span>
        </div>

        <!-- Título principal com line-height e margem rígidos em pixels -->
        <div style="font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px 0; opacity: 0.85; display: block; text-align: center;">
          Preparando seu ambiente
        </div>

        <!-- Subtítulo com tamanho inteiro e altura de linha fixa -->
        <div style="font-size: 12px; line-height: 16px; opacity: 0.55; max-width: 240px; margin: 0 auto; display: block; text-align: center;">
          Carregando banco de questões e configurando sua sessão
        </div>

        <!-- Status de conclusão posicionado abaixo dos textos -->
        <div 
          id="preloader-status-ready"
          style="font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--theme-accent); opacity: 0; transform: translateY(2px); transition: opacity 0.15s ease, transform 0.15s ease; margin-top: 12px;"
        >
          Pronto
        </div>

        <style>
          .silenon-mark-rect {
            stroke: transparent;
            stroke-width: 0;
          }
          html[data-theme="night"] .silenon-mark-rect,
          html[data-theme="amber"] .silenon-mark-rect {
            stroke: var(--theme-border-strong);
            stroke-width: 14px;
          }
          .si-slit-piece {
            transform-box: view-box;
            will-change: transform;
          }
          .si-slit-s-bottom {
            transform-origin: 226px 376px;
            animation: si-emerge-s-bottom 0.68s cubic-bezier(0.22, 1, 0.36, 1) 0ms both;
          }
          .si-slit-i-stem {
            transform-origin: 394px 376px;
            animation: si-emerge-i-stem 0.68s cubic-bezier(0.22, 1, 0.36, 1) 70ms both;
          }
          .si-slit-s-top {
            transform-origin: 226px 376px;
            animation: si-emerge-s-top 0.72s cubic-bezier(0.22, 1, 0.36, 1) 140ms both;
          }
          .si-slit-i-dot {
            transform-origin: 401px 376px;
            animation: si-emerge-i-dot 0.74s cubic-bezier(0.22, 1, 0.36, 1) 210ms both;
          }
          @keyframes si-emerge-s-bottom {
            0% { transform: translateY(150px) rotate(-9deg); }
            62% { transform: translateY(var(--si-peak-y, -118px)) rotate(3.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
          }
          @keyframes si-emerge-i-stem {
            0% { transform: translateY(170px) rotate(-7deg); }
            62% { transform: translateY(var(--si-peak-y, -118px)) rotate(2.8deg); }
            100% { transform: translateY(0px) rotate(0deg); }
          }
          @keyframes si-emerge-s-top {
            0% { transform: translateY(255px) rotate(-10deg); }
            62% { transform: translateY(var(--si-peak-y, -118px)) rotate(4deg); }
            100% { transform: translateY(0px) rotate(0deg); }
          }
          @keyframes si-emerge-i-dot {
            0% { transform: translateY(255px) rotate(-8deg); }
            62% { transform: translateY(var(--si-peak-y, -118px)) rotate(3.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
          }
          .preloader-dot {
            width: 8px;
            height: 8px;
            border-radius: 3px;
            background: var(--theme-accent);
            display: inline-block;
            animation: preloader-wave 1.1s ease-in-out infinite;
          }
          @keyframes preloader-wave {
            0%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1.15); opacity: 1; }
          }
          @keyframes preloader-halo {
            0%, 100% {
              opacity: 0.35;
              transform: scale(0.92);
            }
            50% {
              opacity: 0.75;
              transform: scale(1.16);
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
