<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Silenon — Simples no silício</title>
    <meta name="description" content="Plataforma offline de fixação acelerada de conteúdo, filtros ultra-rápidos e banco de questões estruturado em JSON." />
    <meta property="og:title" content="Silenon — Simples no silício" />
    <meta property="og:description" content="Plataforma offline de fixação acelerada de conteúdo, filtros ultra-rápidos e banco de questões estruturado em JSON." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f1f5f9" />
    
    <!-- Mobile & PWA optimization (iOS & Android) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Silenon" />
    <link rel="icon" type="image/svg+xml" href="/silenon-logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Merriweather:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

    <script>
      (function() {
        try {
          var p = null;
          try {
            p = localStorage.getItem('memoriz_prefs_v1') || localStorage.getItem('memoriz_prefs') || localStorage.getItem('memoriz_theme');
          } catch (storageErr) {}
          var t = 'light';
          if (p) {
            if (p.charCodeAt(0) === 123) { // starts with '{'
              try {
                var parsed = JSON.parse(p);
                if (parsed && parsed.theme) t = parsed.theme;
              } catch (jsonErr) {}
            } else {
              t = p;
            }
          }
          t = t === 'amber' ? 'night' : (t === 'sepia' ? 'reading' : t);
          var C = {
            light:   { b: '#f1f5f9', t: '#0f172a', a: '#2f7596', ac: '#ffffff' },
            dark:    { b: '#07090e', t: '#f8fafc', a: '#6366f1', ac: '#ffffff' },
            reading: { b: '#fbf5e8', t: '#2b1d0c', a: '#854d0e', ac: '#ffffff' },
            night:   { b: '#100300', t: '#ff7733', a: '#ff2b00', ac: '#100300' }
          };
          var c = C[t] || C.light;
          var s = document.documentElement.style;
          s.setProperty('--theme-bg', c.b);
          s.setProperty('--theme-app-bg', c.b);
          s.setProperty('--theme-text-primary', c.t);
          s.setProperty('--theme-accent', c.a);
          s.setProperty('--theme-accent-contrast', c.ac);
          var basePeak = 100 + Math.floor(Math.random() * 36);
          s.setProperty('--si-peak-y', '-' + basePeak + 'px');
          s.setProperty('--si-peak-s-bottom', '-' + (100 + Math.floor(Math.random() * 36)) + 'px');
          s.setProperty('--si-peak-i-stem', '-' + (100 + Math.floor(Math.random() * 36)) + 'px');
          s.setProperty('--si-peak-s-top', '-' + (100 + Math.floor(Math.random() * 36)) + 'px');
          s.setProperty('--si-peak-i-dot', '-' + (100 + Math.floor(Math.random() * 36)) + 'px');
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', c.b);
        } catch (e) {}
      })();

      window.__signalReady = function(onComplete) {
        if (onComplete) {
          onComplete();
        }
      };
    </script>
    <style>
      html[data-theme="light"] { --theme-bg: #f1f5f9; --theme-app-bg: #f1f5f9; --theme-text-primary: #0f172a; --theme-accent: #2f7596; --theme-accent-contrast: #ffffff; --silenon-mark-bg: #080b12; --silenon-mark-fg: #ffffff; --silenon-mark-dot: #ff2b00; }
      html[data-theme="dark"] { --theme-bg: #07090e; --theme-app-bg: #07090e; --theme-text-primary: #f8fafc; --theme-accent: #6366f1; --theme-accent-contrast: #ffffff; --silenon-mark-bg: #080b12; --silenon-mark-fg: #ffffff; --silenon-mark-dot: #ff2b00; }
      html[data-theme="reading"], html[data-theme="sepia"] { --theme-bg: #fbf5e8; --theme-app-bg: #fbf5e8; --theme-text-primary: #2b1d0c; --theme-accent: #854d0e; --theme-accent-contrast: #ffffff; --silenon-mark-bg: #080b12; --silenon-mark-fg: #ffffff; --silenon-mark-dot: #ff2b00; }
      html[data-theme="night"], html[data-theme="amber"] { --theme-bg: #100300; --theme-app-bg: #100300; --theme-surface-elevated: #260900; --theme-border-strong: #801c00; --theme-text-primary: #ff7733; --theme-accent: #ff2b00; --theme-accent-contrast: #100300; --silenon-mark-bg: var(--theme-surface-elevated); --silenon-mark-fg: var(--theme-text-primary); --silenon-mark-dot: var(--theme-accent); }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: var(--theme-bg, var(--theme-app-bg, #100300));
        color: var(--theme-text-primary, #ff7733);
        overflow-x: hidden;
      }
      html:has(#app-preloader),
      body:has(#app-preloader) {
        overflow: hidden !important;
        height: 100% !important;
      }
      #app-preloader {
        opacity: 1 !important;
        background-color: var(--theme-bg, var(--theme-app-bg, #100300)) !important;
      }
      #app-preloader,
      #app-preloader * {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        transition: none !important;
      }
      html[data-theme="night"] #app-preloader img,
      html[data-theme="amber"] #app-preloader img,
      html[data-theme="night"] #app-preloader svg.emoji-filter,
      html[data-theme="amber"] #app-preloader svg.emoji-filter {
        filter: url(#circadian-zero-blue) !important;
        -webkit-filter: url(#circadian-zero-blue) !important;
      }
    </style>
  </head>
  <body class="bg-canvas text-primary antialiased h-[100dvh] overflow-hidden">
    <!-- Hardware/SVG Circadian Zero-Blue Filter Definition (Monochromatic pure red luminance: R = 0.299R + 0.587G + 0.114B, G = 0, B = 0) -->
    <svg width="0" height="0" class="absolute w-0 h-0 overflow-hidden pointer-events-none" aria-hidden="true">
      <filter id="circadian-zero-blue" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="
          0.299  0.587  0.114  0  0
          0.000  0.000  0.000  0  0
          0.000  0.000  0.000  0  0
          0.000  0.000  0.000  1  0" />
      </filter>
    </svg>

    <div id="root">
      <!-- Lightweight, zero-flash pre-mount loading shell consuming inline theme variables -->
      <div 
        id="app-preloader" 
        style="position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; padding: 24px; box-sizing: border-box; text-align: center; opacity: 1; background-color: var(--theme-bg, var(--theme-app-bg)); color: var(--theme-text-primary); z-index: 99999;"
      >

        <!-- Marca limpa centralizada com lançamento e quique exclusivo na abertura (#app-preloader) -->
        <div style="position: relative; width: 88px; height: 88px; margin-bottom: 22px;">
          <svg 
            viewBox="0 0 512 512" 
            width="88" 
            height="88" 
            style="width: 88px; height: 88px; display: block; border-radius: 20px; overflow: visible;"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <clipPath id="silenon-slit-cut-preloader">
                <rect x="-250" y="-250" width="1012" height="626" />
              </clipPath>
            </defs>
            <rect class="silenon-mark-rect" width="512" height="512" rx="112" fill="var(--silenon-mark-bg, #080b12)" stroke="var(--theme-border-strong)" />
            <g clip-path="url(#silenon-slit-cut-preloader)">
              <path 
                class="si-slit-piece si-slit-s-bottom"
                d="M 124 292 L 328 244 V 376 H 124 V 328 H 276 V 304 L 124 340 Z" 
                fill="var(--silenon-mark-fg, #ffffff)" 
              />
              <path 
                class="si-slit-piece si-slit-i-stem"
                d="M 368 235 L 420 223 V 376 H 368 Z" 
                fill="var(--silenon-mark-fg, #ffffff)" 
              />
              <path 
                class="si-slit-piece si-slit-s-top"
                d="M 328 136 H 124 V 264 L 328 216 V 168 L 176 204 V 184 H 328 Z" 
                fill="var(--silenon-mark-fg, #ffffff)" 
              />
              <path 
                class="si-slit-piece si-slit-i-dot"
                d="M 382 136 H 434 L 420 195 L 368 207 Z" 
                fill="var(--silenon-mark-dot, #ff2b00)" 
              />
            </g>
          </svg>
        </div>

        <!-- Micro-dica discreta lida diretamente do localStorage (ou curada padrão) -->
        <p
          id="preloader-tip"
          style="font-size: 13px; line-height: 1.5; font-weight: 400; opacity: 0.72; max-width: 340px; margin: 0 auto; text-align: center;"
        >Quando a escala de uma maquete dobra, comprimentos dobram (×2), áreas quadruplicam (×2²) e volumes multiplicam por oito (×2³), porque cada dimensão cresce junto.</p>

        <script>
          (function() {
            try {
              var tipEl = document.getElementById('preloader-tip');
              if (!tipEl) return;
              var raw = localStorage.getItem('silenon_next_loading_tip');
              if (!raw) return;
              var text = '';
              if (raw.charAt(0) === '{') {
                var parsed = JSON.parse(raw);
                if (parsed && typeof parsed.text === 'string') {
                  text = parsed.text.trim();
                }
              } else {
                text = String(raw).trim();
              }
              if (text) {
                tipEl.textContent = text;
              }
            } catch (e) {}
          })();
        </script>

        <style>
          #app-preloader .silenon-mark-rect {
            stroke: transparent;
            stroke-width: 0;
          }
          html[data-theme="night"] #app-preloader .silenon-mark-rect,
          html[data-theme="amber"] #app-preloader .silenon-mark-rect {
            stroke: var(--theme-border-strong);
            stroke-width: 14px;
          }
          #app-preloader .si-slit-piece {
            transform-box: view-box;
            will-change: transform;
          }
          #app-preloader .si-slit-s-bottom {
            transform-origin: 226px 376px;
            animation: si-emerge-s-bottom 0.96s linear 0ms 1 both;
          }
          #app-preloader .si-slit-i-stem {
            transform-origin: 394px 376px;
            animation: si-emerge-i-stem 0.96s linear 60ms 1 both;
          }
          #app-preloader .si-slit-s-top {
            transform-origin: 226px 376px;
            animation: si-emerge-s-top 1.00s linear 120ms 1 both;
          }
          #app-preloader .si-slit-i-dot {
            transform-origin: 401px 376px;
            animation: si-emerge-i-dot 1.02s linear 180ms 1 both;
          }
          @keyframes si-emerge-s-bottom {
            0%   { transform: translateY(150px) rotate(-9deg); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
            38%  { transform: translateY(var(--si-peak-s-bottom, var(--si-peak-y, -118px))) rotate(3.5deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            64%  { transform: translateY(0px) rotate(0deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
            76%  { transform: translateY(-22px) rotate(-1.2deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            86%  { transform: translateY(0px) rotate(0deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
            93%  { transform: translateY(-7px) rotate(0.4deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            100% { transform: translateY(0px) rotate(0deg); }
          }
          @keyframes si-emerge-i-stem {
            0%   { transform: translateY(170px) rotate(-7deg); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
            38%  { transform: translateY(var(--si-peak-i-stem, var(--si-peak-y, -118px))) rotate(2.8deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            64%  { transform: translateY(0px) rotate(0deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
            76%  { transform: translateY(-22px) rotate(-1deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            86%  { transform: translateY(0px) rotate(0deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
            93%  { transform: translateY(-7px) rotate(0.3deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            100% { transform: translateY(0px) rotate(0deg); }
          }
          @keyframes si-emerge-s-top {
            0%   { transform: translateY(255px) rotate(-10deg); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
            38%  { transform: translateY(var(--si-peak-s-top, var(--si-peak-y, -118px))) rotate(4deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            64%  { transform: translateY(0px) rotate(0deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
            76%  { transform: translateY(-22px) rotate(-1.4deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            86%  { transform: translateY(0px) rotate(0deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
            93%  { transform: translateY(-7px) rotate(0.5deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            100% { transform: translateY(0px) rotate(0deg); }
          }
          @keyframes si-emerge-i-dot {
            0%   { transform: translateY(255px) rotate(-8deg); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
            38%  { transform: translateY(var(--si-peak-i-dot, var(--si-peak-y, -118px))) rotate(3.5deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            64%  { transform: translateY(0px) rotate(0deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
            76%  { transform: translateY(-22px) rotate(-1.1deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            86%  { transform: translateY(0px) rotate(0deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
            93%  { transform: translateY(-7px) rotate(0.4deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            100% { transform: translateY(0px) rotate(0deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
