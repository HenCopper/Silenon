<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Container Sólido -->
  <rect width="512" height="512" rx="112" fill="#080B12" />

  <!--
    100% RÉGUAS RETAS E PARALELAS:
    Sem nenhuma curva. Três barras horizontais/diagonais regem o "S" e o "i" ao mesmo tempo.
  -->

  <!-- Bloco Superior do "S" -->
  <path d="M 328 136
           H 124
           V 264
           L 328 216
           V 168
           L 176 204
           V 184
           H 328
           Z"
        fill="#FFFFFF" />

  <!-- Bloco Inferior do "S" -->
  <path d="M 124 292
           L 328 244
           V 376
           H 124
           V 328
           H 276
           V 304
           L 124 340
           Z"
        fill="#FFFFFF" />

  <!-- Haste do "i" (Segue exatamente a régua do corte central do S) -->
  <path d="M 368 235
           L 420 223
           V 376
           H 368
           Z"
        fill="#FFFFFF" />

  <!-- Topo do "i" (Alinhado à régua superior em 136px e projetado à frente) -->
